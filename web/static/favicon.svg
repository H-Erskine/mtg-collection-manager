<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="15" fill="#16213e" stroke="#f0c040" stroke-width="1.5"/>
  <!-- Pentagon (five-color pie outline) -->
  <polygon points="16,4 27.5,12 23,25 9,25 4.5,12"
           fill="none" stroke="#f0c040" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#f0c040"/>
  <!-- Lines from center to each vertex -->
  <line x1="16" y1="16" x2="16" y2="4"       stroke="#f0c040" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="27.5" y2="12"    stroke="#f0c040" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="23" y2="25"       stroke="#f0c040" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="9" y2="25"        stroke="#f0c040" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="4.5" y2="12"     stroke="#f0c040" stroke-width="1" opacity="0.7"/>
</svg>
