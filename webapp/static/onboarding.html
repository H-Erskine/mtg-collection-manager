<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Collection — Welcome</title>
<link rel="stylesheet" href="/static/modernist.css">
<style>
  .page { padding: 40px var(--space-6); max-width: 640px; margin: 0 auto; }
  .welcome { margin-bottom: var(--space-6); }
  .welcome h1 { font-size: 20px; margin-bottom: var(--space-1); }
  .welcome p { color: color-mix(in srgb, var(--color-text) 55%, transparent); font-size: 13px; }
  h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: var(--space-3); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-divider); }
  label { display: block; font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: 4px; }
  .row { display: flex; gap: var(--space-2); align-items: center; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--color-divider); }
  .row:last-child { border-bottom: none; }
  .msg { font-size: 13px; margin-top: var(--space-2); }
  .msg.ok { color: var(--color-text); }
  .msg.err { color: var(--color-accent-700); }
  .inline-form { display: flex; gap: var(--space-2); align-items: flex-end; }
  .inline-form input { margin-bottom: 0; }
  .icon-palette { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
  .icon-option { font-size: 20px; padding: 6px 10px; border: 1px solid var(--color-divider); cursor: pointer; }
  .icon-option:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .icon-option.selected { border-color: var(--color-accent); background: var(--color-accent-100); }
  .finish-row { display: flex; justify-content: flex-end; }
</style>
</head>
<body>

<div class="page">
  <div class="welcome">
    <h1>Welcome to MTG Collection</h1>
    <p>Let's get your profile set up.</p>
  </div>

  <div class="flush-section">
    <h2>Profile</h2>
    <label>Display name</label>
    <input class="input" id="profile-name" placeholder="e.g. Alice">
    <label>Icon</label>
    <div id="profile-icon-palette" class="icon-palette"></div>
    <input type="hidden" id="profile-icon">
  </div>

  <div class="flush-section">
    <h2>Moxfield Package <span style="color:color-mix(in srgb, var(--color-text) 55%, transparent);font-weight:normal">(optional — you can add this later in Config)</span></h2>
    <div id="packages-list"></div>
    <div class="inline-form" style="margin-top:12px">
      <div style="flex:1"><label>Color group</label><input class="input" id="pkg-color" placeholder="e.g. Red"></div>
      <div style="flex:1"><label>Moxfield deck</label><input class="input" id="pkg-id" placeholder="Paste a moxfield.com/decks/... URL or just the slug"></div>
      <button class="btn btn-secondary" onclick="addPackage()">Add</button>
    </div>
    <div id="pkg-msg" class="msg"></div>
  </div>

  <div class="finish-row">
    <button class="btn btn-primary" id="finish-btn" onclick="finishOnboarding()" disabled>Finish</button>
  </div>
  <div id="finish-msg" class="msg"></div>
</div>

<script>
const ICON_OPTIONS = ['⚔', '🐉', '🔥', '💧', '🌿', '☀️', '💀', '🌈', '🃏', '🎲', '🦄', '🧙', '👑', '⭐'];
let packages = [];

function renderIconPalette(selected) {
  const palette = document.getElementById('profile-icon-palette');
  palette.innerHTML = '';
  for (const icon of ICON_OPTIONS) {
    const btn = document.createElement('div');
    btn.className = 'icon-option' + (icon === selected ? ' selected' : '');
    btn.textContent = icon;
    btn.onclick = () => selectIcon(icon);
    palette.appendChild(btn);
  }
}

function selectIcon(icon) {
  document.getElementById('profile-icon').value = icon;
  renderIconPalette(icon);
  updateFinishState();
}

function updateFinishState() {
  const name = document.getElementById('profile-name').value.trim();
  const icon = document.getElementById('profile-icon').value.trim();
  document.getElementById('finish-btn').disabled = !(name && icon);
}

function renderPackages() {
  const list = document.getElementById('packages-list');
  list.innerHTML = '';
  if (!packages.length) {
    list.innerHTML = '<p style="color:color-mix(in srgb, var(--color-text) 55%, transparent);font-size:13px">No packages yet.</p>';
    return;
  }
  for (const p of packages) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${p.color_group} → <code>${p.public_id}</code></span>`;
    list.appendChild(row);
  }
}

async function addPackage() {
  const color_group = document.getElementById('pkg-color').value.trim();
  const public_id = document.getElementById('pkg-id').value.trim();
  if (!color_group || !public_id) return;
  const res = await fetch('/api/config/packages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ color_group, public_id }),
  });
  const msg = document.getElementById('pkg-msg');
  msg.textContent = res.ok ? 'Added.' : 'Failed to add package.';
  msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
  if (res.ok) {
    document.getElementById('pkg-color').value = '';
    document.getElementById('pkg-id').value = '';
    await loadPackages();
  }
}

async function loadPackages() {
  const res = await fetch('/api/config');
  if (!res.ok) return;
  const data = await res.json();
  packages = data.packages;
  renderPackages();
}

async function finishOnboarding() {
  const display_name = document.getElementById('profile-name').value.trim();
  const icon = document.getElementById('profile-icon').value.trim();
  if (!display_name || !icon) return;

  const finishMsg = document.getElementById('finish-msg');
  const profileRes = await fetch('/api/config/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ display_name, icon }),
  });
  if (!profileRes.ok) {
    finishMsg.textContent = 'Failed to save profile.';
    finishMsg.className = 'msg err';
    return;
  }

  const completeRes = await fetch('/api/onboarding/complete', { method: 'POST' });
  if (!completeRes.ok) {
    finishMsg.textContent = 'Failed to complete onboarding.';
    finishMsg.className = 'msg err';
    return;
  }
  location.href = '/app';
}

renderIconPalette('');
loadPackages();
document.getElementById('profile-name').addEventListener('input', updateFinishState);
</script>
</body>
</html>
