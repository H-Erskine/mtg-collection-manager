[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cloudscraper>=1.2.71",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.scripts]
mtg = "mtg_manager.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtg_manager*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
