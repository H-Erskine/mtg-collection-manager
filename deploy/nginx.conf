# Nginx site config for MTG Manager API
# Place at: /etc/nginx/sites-available/mtg-manager
# Enable with: sudo ln -s /etc/nginx/sites-available/mtg-manager /etc/nginx/sites-enabled/
# Then run Certbot: sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;  # REPLACE with your actual domain

    # Certbot will add SSL directives here automatically when you run it.
    # After running certbot, this block will be replaced with a redirect to HTTPS.

    location /webhook {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Twilio webhooks time out at 15 seconds — give a little headroom
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location /health {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
    }

    # Block everything else
    location / {
        return 404;
    }
}
