# Nginx site config for MTG Manager
# Place at: /etc/nginx/sites-available/mtg-manager
# Enable with: sudo ln -s /etc/nginx/sites-available/mtg-manager /etc/nginx/sites-enabled/
# Then run Certbot: sudo certbot --nginx -d erskymtg.co.uk -d www.erskymtg.co.uk

server {
    listen 80;
    server_name erskymtg.co.uk www.erskymtg.co.uk;

    # Certbot will add SSL directives here automatically when you run it.
    # After running certbot, this block will be replaced with a redirect to HTTPS.

    root /home/ubuntu/mtg-manager/web/static;
    index index.html;

    location /health {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
