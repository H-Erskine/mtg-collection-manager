name: Deploy to Oracle VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 132.145.53.92
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/mtg-manager
            git pull
            sudo systemctl restart mtg-bot
            sudo systemctl status mtg-bot --no-pager
            cd ~/mtg-manager-web
            git fetch origin
            git checkout main
            git reset --hard origin/main
            .venv/bin/pip install -q -r requirements-web.txt
            sudo systemctl restart mtg-web
            sudo systemctl status mtg-web --no-pager
            sudo systemctl reload nginx
